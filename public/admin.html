<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KIB1 — Pedagoga panelis</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2322c55e'/><text x='32' y='42' font-size='24' font-family='Arial' font-weight='900' text-anchor='middle' fill='white'>CIA</text></svg>">
  <link rel="stylesheet" href="/style.css">
  <style>
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .8rem; margin-bottom: 1.2rem; }
    .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: .9rem 1rem; }
    .kpi .v { font-size: 1.8rem; font-weight: 900; line-height: 1.1; }
    .kpi .k { color: var(--muted); font-size: .85rem; }
    .tabs { display: flex; gap: .4rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .tabs .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .stable { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; }
    .stable th, .stable td { padding: .6rem .7rem; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    .stable th { color: var(--faint); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; user-select: none; background: var(--panel2); }
    .stable tr.click:hover td { background: var(--panel2); cursor: pointer; }
    .mini { width: 90px; height: 7px; background: var(--panel3); border-radius: 9px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: .4rem; }
    .mini i { display: block; height: 100%; background: var(--accent); }
    .st { font-size: .8rem; font-weight: 700; padding: .15em .55em; border-radius: 6px; }
    .st.done { background: rgba(34,197,94,.18); color: var(--ok); }
    .st.active { background: var(--accent-bg); color: #c8b9ff; }
    .st.idle { background: rgba(234,179,8,.14); color: var(--half); }
    .st.absent { background: var(--panel3); color: var(--faint); }
    .pct-low { color: var(--bad); font-weight: 700; } .pct-mid { color: var(--half); font-weight: 700; } .pct-hi { color: var(--ok); font-weight: 700; }
    .errrow { display: grid; grid-template-columns: 70px 1fr; gap: .8rem; align-items: center; padding: .6rem 0; border-bottom: 1px solid var(--line); }
    .errrow .p { font-size: 1.6rem; font-weight: 900; color: var(--half); text-align: right; }
    .errbar { height: 6px; background: var(--panel3); border-radius: 9px; overflow: hidden; margin-top: .3rem; }
    .errbar i { display: block; height: 100%; background: var(--half); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .itemrow { border-bottom: 1px solid var(--line); padding: .7rem 0; }
    .itemrow .top { display: flex; gap: .6rem; align-items: flex-start; }
    .itemrow .lab { flex: 1; font-weight: 600; }
    .kv { display: grid; grid-template-columns: 120px 1fr; gap: .2rem .8rem; font-size: .9rem; margin-top: .4rem; }
    .kv .k { color: var(--faint); }
    .errtag { display: inline-block; font-size: .78rem; background: rgba(240,82,82,.14); color: #ffb4b4; border-radius: 6px; padding: .1em .5em; margin: .15rem .2rem 0 0; }
    .ov { display: flex; gap: .4rem; align-items: center; margin-top: .5rem; flex-wrap: wrap; }
    .ov input { width: 90px; } .ov input.note { width: 260px; }
    details.mod { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: .8rem 1rem; margin-bottom: .7rem; }
    details.mod summary { cursor: pointer; font-weight: 700; }
    .wrapx { overflow-x: auto; }
    @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="app"><div class="login-wrap"><div class="login">Ielādē…</div></div></div>
  <script src="/admin.js"></script>
</body>
</html>
